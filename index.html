<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stark Industries - HUD Tactical System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- TensorFlow.js y COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020617;
            color: #38bdf8;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .hud-grid {
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Filtros Ópticos */
        .filter-thermal {
            filter: hue-rotate(140deg) contrast(180%) saturate(200%);
        }
        .filter-night {
            filter: sepia(100%) hue-rotate(60deg) saturate(500%) brightness(90%) contrast(150%);
        }
        .filter-holo {
            filter: hue-rotate(180deg) brightness(120%) contrast(140%);
        }

        /* Animaciones HUD */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanline {
            animation: scanline 4s linear infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }
        .glow-pulse {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Ocultar scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="relative w-screen h-screen m-0 p-0 overflow-hidden bg-black">

    <!-- 1. FEED DE CÁMARA A PANTALLA COMPLETA -->
    <div id="camera-container" class="absolute inset-0 w-full h-full overflow-hidden z-0">
        <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="vision-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
        <!-- Escaneo visual -->
        <div class="absolute inset-0 w-full h-1 bg-cyan-400/30 scanline pointer-events-none z-10"></div>
    </div>

    <!-- 2. CAPA DE FILTROS ÓPTICOS -->
    <div id="optical-filter" class="absolute inset-0 pointer-events-none z-20 transition-all duration-300"></div>

    <!-- 3. INTERFAZ MINIMALISTA TIPO STARK (HUD CLEAN) -->
    <div class="absolute inset-0 z-30 pointer-events-none flex flex-col justify-between p-4 hud-grid">

        <!-- Header: Estado del Sistema & Telemetría Mínima -->
        <div class="flex justify-between items-start text-xs text-cyan-400 font-bold tracking-widest drop-shadow-[0_0_8px_rgba(56,189,248,0.8)]">
            <div class="bg-black/40 px-3 py-1.5 rounded border border-cyan-500/30 backdrop-blur-md">
                <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping mr-1"></span>
                MARK L // OS: JARVIS v9.4
                <div class="text-[10px] text-cyan-300/70 font-normal">AI MODEL: <span id="ai-status">INITIALIZING...</span></div>
            </div>
            
            <!-- Brújula & Coordenadas Centrales -->
            <div class="hidden sm:flex flex-col items-center bg-black/40 px-4 py-1 rounded border border-cyan-500/30 backdrop-blur-md">
                <div class="text-cyan-300" id="compass-heading">HDG: 284° NW</div>
                <div class="text-[9px] text-cyan-500">LAT: 16.4090° S // LON: 71.5375° W</div>
            </div>

            <div class="bg-black/40 px-3 py-1.5 rounded border border-cyan-500/30 backdrop-blur-md text-right">
                <div>PWR: <span class="text-emerald-400">98.4%</span> (ARC REACTOR)</div>
                <div class="text-[10px] text-cyan-300/70">TARGETS: <span id="target-count">0</span> DETECTED</div>
            </div>
        </div>

        <!-- Centro: Retícula de Mira y Lock-on Automático -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="relative w-48 h-48 border border-cyan-500/20 rounded-full flex items-center justify-center glow-pulse">
                <div class="absolute w-full h-[1px] bg-cyan-500/40"></div>
                <div class="absolute h-full w-[1px] bg-cyan-500/40"></div>
                <div class="w-12 h-12 border-2 border-cyan-400 rounded-full flex items-center justify-center">
                    <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-ping"></div>
                </div>
                <!-- Esquinas de retícula -->
                <div class="absolute top-2 left-2 w-3 h-3 border-t-2 border-l-2 border-cyan-400"></div>
                <div class="absolute top-2 right-2 w-3 h-3 border-t-2 border-r-2 border-cyan-400"></div>
                <div class="absolute bottom-2 left-2 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
                <div class="absolute bottom-2 right-2 w-3 h-3 border-b-2 border-r-2 border-cyan-400"></div>
            </div>
        </div>

        <!-- Footer: Controles Tácticos Interactivos (Clickables pointer-auto) -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pointer-events-auto">
            
            <!-- Grupo de Ópticas y Filtros -->
            <div class="flex gap-2 bg-black/60 p-2 rounded-lg border border-cyan-500/30 backdrop-blur-md">
                <button onclick="setFilter('')" class="px-3 py-1.5 text-xs bg-cyan-950/60 hover:bg-cyan-600/40 border border-cyan-500/40 rounded text-cyan-300 transition">NORMAL</button>
                <button onclick="setFilter('filter-thermal')" class="px-3 py-1.5 text-xs bg-amber-950/60 hover:bg-amber-600/40 border border-amber-500/40 rounded text-amber-300 transition">TÉRMICO</button>
                <button onclick="setFilter('filter-night')" class="px-3 py-1.5 text-xs bg-emerald-950/60 hover:bg-emerald-600/40 border border-emerald-500/40 rounded text-emerald-300 transition">NIGHT</button>
                <button onclick="setFilter('filter-holo')" class="px-3 py-1.5 text-xs bg-blue-950/60 hover:bg-blue-600/40 border border-blue-500/40 rounded text-blue-300 transition">HOLO</button>
            </div>

            <!-- Controles Centrales de Acción -->
            <div class="flex gap-2 bg-black/60 p-2 rounded-lg border border-cyan-500/30 backdrop-blur-md items-center">
                <button onclick="toggleCamera()" id="btn-cam" class="px-4 py-2 text-xs bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded shadow-[0_0_10px_rgba(56,189,248,0.5)] transition">
                    CÁMARA ON
                </button>
                <button onclick="triggerRepulsor()" class="px-4 py-2 text-xs bg-red-600 hover:bg-red-500 text-white font-bold rounded shadow-[0_0_10px_rgba(239,68,68,0.5)] transition">
                    REPULSOR ⚡
                </button>
                <button onclick="toggleVR()" class="px-4 py-2 text-xs bg-purple-600 hover:bg-purple-500 text-white font-bold rounded shadow-[0_0_10px_rgba(168,85,247,0.5)] transition">
                    VR SBS
                </button>
            </div>

            <!-- Controles de Zoom y Audio JARVIS -->
            <div class="flex gap-2 bg-black/60 p-2 rounded-lg border border-cyan-500/30 backdrop-blur-md">
                <button onclick="setZoom(1)" class="px-3 py-1.5 text-xs bg-cyan-950/60 hover:bg-cyan-600/40 border border-cyan-500/40 rounded text-cyan-300">1X</button>
                <button onclick="setZoom(2)" class="px-3 py-1.5 text-xs bg-cyan-950/60 hover:bg-cyan-600/40 border border-cyan-500/40 rounded text-cyan-300">2X</button>
                <button onclick="toggleJarvisVoice()" id="btn-jarvis" class="px-3 py-1.5 text-xs bg-cyan-950/60 hover:bg-cyan-600/40 border border-cyan-500/40 rounded text-cyan-300">JARVIS: 🔊</button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE CONTROL Y VISIÓN ARTIFICIAL -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('vision-canvas');
        const ctx = canvas.getContext('2d');
        const aiStatus = document.getElementById('ai-status');
        const targetCountEl = document.getElementById('target-count');
        
        let model = null;
        let isCameraActive = false;
        let jarvisActive = true;
        let lastSpokenTarget = "";

        // 1. Inicializar Cámara HD trasera/frontal adaptativa para móviles
        async function toggleCamera() {
            if (!isCameraActive) {
                try {
                    const constraints = {
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    isCameraActive = true;
                    document.getElementById('btn-cam').innerText = "CÁMARA OFF";
                    document.getElementById('btn-cam').classList.replace('bg-cyan-600', 'bg-red-600');
                    
                    // Ajustar tamaño del canvas al stream
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    };

                    speakJarvis("Sistemas ópticos en línea. Iniciando escaneo biométrico.");
                    initAI();
                } catch (err) {
                    alert("Error al acceder a la cámara: " + err.message);
                }
            } else {
                const stream = video.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
                isCameraActive = false;
                document.getElementById('btn-cam').innerText = "CÁMARA ON";
                document.getElementById('btn-cam').classList.replace('bg-red-600', 'bg-cyan-600');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                aiStatus.innerText = "STANDBY";
            }
        }

        // 2. Cargar Modelo de Detección COCO-SSD (IA)
        async function initAI() {
            aiStatus.innerText = "LOADING AI...";
            try {
                model = await cocoSsd.load();
                aiStatus.innerText = "ONLINE (COCO-SSD)";
                detectObjects();
            } catch (e) {
                aiStatus.innerText = "ERROR AI";
            }
        }

        // 3. Bucle de Visión Artificial en Tiempo Real
        async function detectObjects() {
            if (!isCameraActive || !model) return;
            
            try {
                const predictions = await model.detect(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                targetCountEl.innerText = predictions.length;

                predictions.forEach(prediction => {
                    const [x, y, width, height] = prediction.bbox;
                    
                    // Dibujar retícula táctil tipo Stark alrededor del objeto
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);

                    // Esquinas decorativas de la caja
                    const cornerLen = 10;
                    ctx.fillStyle = '#38bdf8';
                    // Top-Left
                    ctx.fillRect(x, y, cornerLen, 3);
                    ctx.fillRect(x, y, 3, cornerLen);
                    // Top-Right
                    ctx.fillRect(x + width - cornerLen, y, cornerLen, 3);
                    ctx.fillRect(x + width - 3, y, 3, cornerLen);
                    // Bottom-Left
                    ctx.fillRect(x, y + height - 3, cornerLen, 3);
                    ctx.fillRect(x, y + height - cornerLen, 3, cornerLen);
                    // Bottom-Right
                    ctx.fillRect(x + width - cornerLen, y + height - 3, cornerLen, 3);
                    ctx.fillRect(x + width - 3, y + height - cornerLen, 3, cornerLen);

                    // Texto de identificación
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = '14px "Share Tech Mono", monospace';
                    ctx.fillText(`${prediction.class.toUpperCase()} [${Math.round(prediction.score * 100)}%]`, x, y > 20 ? y - 8 : y + 15);

                    // Alerta de voz JARVIS si detecta persona (human)
                    if (prediction.class === 'person' && jarvisActive && lastSpokenTarget !== 'person') {
                        speakJarvis("Objetivo humano identificado en el campo visual.");
                        lastSpokenTarget = 'person';
                        setTimeout(() => { lastSpokenTarget = ""; }, 8000);
                    }
                });
            } catch (err) {
                console.error(err);
            }

            if (isCameraActive) {
                requestAnimationFrame(detectObjects);
            }
        }

        // 4. Cambiar Filtros Ópticos
        function setFilter(filterClass) {
            const filterLayer = document.getElementById('optical-filter');
            filterLayer.className = `absolute inset-0 pointer-events-none z-20 transition-all duration-300 ${filterClass}`;
        }

        // 5. Zoom Táctico
        function setZoom(scale) {
            video.style.transform = `scale(${scale})`;
            canvas.style.transform = `scale(${scale})`;
        }

        // 6. Efecto de Sonido y Disparo de Repulsor (Web Audio API)
        function triggerRepulsor() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.5);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
            
            speakJarvis("Sistemas repulsores armados.");
        }

        // 7. Síntesis de Voz JARVIS
        function speakJarvis(text) {
            if (!jarvisActive) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.pitch = 0.8;
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleJarvisVoice() {
            jarvisActive = !jarvisActive;
            const btn = document.getElementById('btn-jarvis');
            btn.innerText = jarvisActive ? "JARVIS: 🔊" : "JARVIS: 🔇";
        }

        // 8. Modo VR SBS (Side-by-Side Split)
        function toggleVR() {
            alert("Modo VR activado. Coloque el teléfono en su visor Cardboard o Gafas VR.");
            // Duplica el contenedor visual si se desea simular doble lente
        }

        // Actualizar brújula aleatoria para realismo táctico
        setInterval(() => {
            const hdg = Math.floor(280 + Math.random() * 10);
            document.getElementById('compass-heading').innerText = `HDG: ${hdg}° NW`;
        }, 2000);
    </script>
</body>
</html>
